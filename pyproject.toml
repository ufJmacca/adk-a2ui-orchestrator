[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-a2ui-orchestrator-demo"
version = "0.1.0"
description = "Local ADK 2.0+ A2UI orchestrator demo for business banking relationship managers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[eval]==2.1.0",
    "a2ui-agent-sdk",
    "a2a-sdk>=0.3.4,<0.4",
    "litellm",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sse-starlette>=3.4.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["orchestrator_demo"]
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
include = ["orchestrator_demo*"]
exclude = ["prds*", "tests*"]

[tool.setuptools.package-data]
"orchestrator_demo.orchestrator" = ["agent.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not adk_eval_runner"]
markers = [
    "adk_eval_runner: opt-in ADK eval runner tests for non-required eval-basic lane.",
]
