name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check --output-format=github .

      - name: Mypy
        run: uv run --locked mypy orchestrator_demo

      - name: Tests
        run: uv run --locked pytest

  eval-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked

      - name: Run deterministic fixed ADK evals
        env:
          ORCHESTRATOR_DEMO_DETERMINISTIC_MODEL: "1"
          ORCHESTRATOR_DEMO_ADK_EVAL_MODE: "1"
        run: |
          mkdir -p .ai-native/eval-basic
          set -o pipefail
          uv run --locked pytest tests/test_adk_evalsets.py -m adk_eval_runner -ra 2>&1 | tee .ai-native/eval-basic/eval-basic.log

      - name: Upload eval-basic results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eval-basic-results
          path: .ai-native/eval-basic/
          include-hidden-files: true
          if-no-files-found: warn
